
name: Build FIFA Cloud 18 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip -q fifa-cloud-18-android-prototype.zip -d _project
          rsync -a _project/fifa-cloud-18/ ./

      - name: Preparar interface
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp -R web/. android-app/app/src/main/assets/www/

      - name: Compilar APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FIFA-Cloud-18-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          
