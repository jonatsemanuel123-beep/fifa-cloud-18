
name: Build FIFA Cloud 18 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip -q fifa-cloud-18-android-prototype.zip -d _project
          find _project -name settings.gradle -print

      - name: Preparar aplicativo
        run: |
          ANDROID_DIR="$(dirname "$(find _project -name settings.gradle -print -quit)")"
          PROJECT_DIR="$(dirname "$ANDROID_DIR")"
          mkdir -p "$ANDROID_DIR/app/src/main/assets/www"
          cp -R "$PROJECT_DIR/web/." "$ANDROID_DIR/app/src/main/assets/www/"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FIFA-Cloud-18-APK
          path: _project/fifa-cloud-18/android-app/app/build/outputs/apk/debug/app-debug.apk
          
